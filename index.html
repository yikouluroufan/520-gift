<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>5.20 专属小测验</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 欢迎页 -->
  <div id="welcome-page" class="page active">
    <div class="welcome-content">
      <h1 class="main-title">关于卤肉饭的<br>小测验</h1>
      <p class="subtitle">只有足够了解我的人，才能打开奖励</p>
      <button id="start-btn" class="btn-primary">开始答题</button>
    </div>
  </div>

  <!-- 答题页 -->
  <div id="quiz-page" class="page">
    <div class="quiz-header">
      <div class="progress-dots" id="progress-dots"></div>
      <span class="progress-text" id="progress-text">1/6</span>
    </div>
    <div class="question-card" id="question-card">
      <p class="question-text" id="question-text"></p>
      <div class="options-container" id="options-container"></div>
    </div>
    <div class="feedback-area" id="feedback-area"></div>
  </div>

  <!-- 结果页 -->
  <div id="result-page" class="page">
    <div class="result-content">
      <div class="score-section">
        <p class="score-label">你的好感度分数</p>
        <div class="score-number" id="score-number">0</div>
      </div>
      <div class="level-section" id="level-section">
        <p class="level-name" id="level-name"></p>
        <p class="level-desc" id="level-desc"></p>
      </div>
      <div class="reward-card" id="reward-card">
        <p class="reward-title">🎁 专属奖励</p>
        <p class="reward-text" id="reward-text"></p>
      </div>
      <!-- 喵喵喵 -->
      <p class="final-message" id="final-message">
        其实分数根本不重要。<br>因为这个网页，从第一行代码开始，<br>就是为你一个人写的。<br>5.20快乐 💗
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
